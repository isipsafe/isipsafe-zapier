name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DISABLE_ZAPIER_ANALYTICS: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - name: Validate the integration schema
        run: npm run validate
